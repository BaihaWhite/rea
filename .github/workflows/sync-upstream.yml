name: Sync upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream (server-side merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
